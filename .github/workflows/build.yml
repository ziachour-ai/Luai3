name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: unzip -q ARScreenAnchor.zip
      - name: Compiler
        working-directory: ARScreenAnchor
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Erreurs
        if: failure()
        run: |
          echo '### Erreurs de compilation' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^e: " build.log | head -20 >> $GITHUB_STEP_SUMMARY || true
          grep -A6 "What went wrong" build.log | head -15 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ARScreenAnchor-apk
          path: ARScreenAnchor/app/build/outputs/apk/debug/app-debug.apk
